openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Fridge & Freezer Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Inventory product operations
  - name: users
    description: User profile operations
  - name: ai
    description: AI parsing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: location
          in: query
          required: false
          schema:
            type: string
            enum: [fridge, freezer]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product (kept on the deleted list for a week)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Moved to the deleted list; removed for good after seven days

  /products/{id}/permanent:
    delete:
      operationId: purgeProduct
      tags: [products]
      summary: Remove a product for good, skipping the deleted list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /products/deleted:
    get:
      operationId: listDeletedProducts
      tags: [products]
      summary: List deleted products, newest deletion first (kept for seven days)
      responses:
        "200":
          description: Deleted products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}/restore:
    post:
      operationId: restoreProduct
      tags: [products]
      summary: Put a deleted product back
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /products/summary:
    get:
      operationId: getProductsSummary
      tags: [products]
      summary: Get counts by location
      responses:
        "200":
          description: Summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsSummary"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Retrieve the signed-in user's app profile
      security:
        - ClerkSession: []
      parameters:
        - name: x-device-id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: App profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: No profile is linked to this sign-in
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update the signed-in user's app profile
      security:
        - ClerkSession: []
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated app profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "403":
          description: Profile does not belong to the signed-in user
    delete:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Remove the current device profile
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "204":
          description: Device profile removed; shared inventory is retained
        "400":
          description: Missing or invalid device ID
        "403":
          description: Profile does not belong to the signed-in user
        "500":
          description: Reset failed

  /users/me/household:
    delete:
      operationId: leaveCurrentHousehold
      tags: [users]
      summary: Remove the signed-in user's household membership
      parameters:
        - name: x-device-id
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "204":
          description: Household membership removed
        "400":
          description: Missing or invalid device ID
        "403":
          description: Profile does not belong to the signed-in user

  /users/admin-status:
    get:
      operationId: getCurrentUserAdminStatus
      tags: [users]
      summary: Check whether the signed-in user is a developer
      responses:
        "200":
          description: Admin access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"

  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user profile and its sign-in account
      security:
        - ClerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User removed
          content:
            application/json:
              schema:
                type: object
                required: [ok, signInAccountDeleted]
                properties:
                  ok:
                    type: boolean
                  signInAccountDeleted:
                    type: boolean
                    description: False when the profile was removed but the Clerk sign-in account could not be deleted
        "400":
          description: Invalid id, or the caller tried to delete their own account
        "403":
          description: Developer access required
        "404":
          description: User not found

  /ai/parse-receipt:
    post:
      operationId: parseReceipt
      tags: [ai]
      summary: Parse OCR text into structured product data using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseReceiptInput"
      responses:
        "200":
          description: Parsed product items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParsedItem"

components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      required: [id, name, quantity, unit, storageLocation, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        storageLocation:
          type: string
          enum: [fridge, freezer, pantry]
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: When the product was deleted. Products deleted more than seven days ago are removed automatically.

    ProductInput:
      type: object
      required: [name, quantity, unit, storageLocation]
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: number
        unit:
          type: string
        storageLocation:
          type: string
          enum: [fridge, freezer, pantry]

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        quantity:
          type: number
        unit:
          type: string
        storageLocation:
          type: string
          enum: [fridge, freezer, pantry]

    ProductsSummary:
      type: object
      required: [fridge, freezer, pantry, total]
      properties:
        fridge:
          type: integer
        freezer:
          type: integer
        pantry:
          type: integer
        total:
          type: integer

    ParseReceiptInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    ParsedItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
        quantity:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
    UserProfile:
      type: object
      required: [id, deviceId, username, isBanned, createdAt]
      properties:
        id:
          type: integer
        deviceId:
          type: string
        username:
          type: string
        isBanned:
          type: boolean
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        householdId:
          type: ["integer", "null"]
        householdName:
          type: ["string", "null"]
        householdIsCreator:
          type: boolean
    UserProfileUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
    AdminStatus:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
